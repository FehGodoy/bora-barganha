name: worker

on:
  schedule:
    # A cada 20 min, em UTC: 11h-00h UTC = 8h-21h em Brasília. Minutos "quebrados" fogem do pico do cron.
    # A coleta alimenta a vitrine sem enviar mensagens.
    - cron: "7,27,47 11-23 * * *"
    - cron: "7,27,47 0 * * *"
  workflow_dispatch:

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Rodada do worker
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_APP_SECRET: ${{ secrets.SHOPEE_APP_SECRET }}
          BORA_WORKER_PAUSED: ${{ vars.BORA_WORKER_PAUSED || 'false' }}
        run: python worker.py --collect-only
